<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Paneli</title>
<style>
  :root{--bg:#f5f5f7;--surface:#fff;--text:#1d1d1f;--muted:#6e6e73;--accent:#0071e3;--border:#d2d2d7;--danger:#c62828;}
  @media (prefers-color-scheme: dark){
    :root{--bg:#121214;--surface:#1c1c1e;--text:#f2f2f7;--muted:#9a9aa0;--accent:#4da3ff;--border:#3a3a3c;--danger:#ff6b6b;}
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px 16px;}
  h1{font-size:1.3rem;margin:0 0 16px;}
  .status{font-size:.85rem;color:var(--muted);margin-bottom:14px;}
  .scroll{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);}
  table{width:100%;border-collapse:collapse;font-size:.8rem;}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
  th{color:var(--muted);font-weight:600;}
  .empty{color:var(--muted);text-align:center;padding:30px 0;font-size:.9rem;}
  button.del{background:transparent;border:1px solid var(--danger);color:var(--danger);border-radius:6px;padding:4px 8px;font-size:.75rem;cursor:pointer;}
</style>
</head>
<body>
<h1>Admin Paneli</h1>
<div class="status" id="status">Yükleniyor…</div>
<div class="scroll"><table id="tbl"></table></div>
<script>
function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }

async function load(){
  const status = document.getElementById('status');
  try{
    const res = await fetch('/api/submissions');
    const rows = await res.json();
    status.textContent = rows.length + ' kayıt';
    const tbl = document.getElementById('tbl');
    if(!rows.length){
      document.querySelector('.scroll').innerHTML = '<div class="empty">Henüz kayıt yok.</div>';
      return;
    }
    tbl.innerHTML = `
      <tr><th>İsim</th><th>IP</th><th>Marka/Cihaz</th><th>Platform</th><th>Dil</th><th>Ekran</th><th>Saat Dilimi</th><th>Konum</th><th>Tarih</th><th></th></tr>
      ${rows.map(r=>{
        const loc = (r.lat!=null && r.lon!=null) ? (r.lat.toFixed(4)+', '+r.lon.toFixed(4)) : (r.locationStatus || '-');
        return `<tr>
          <td>${esc(r.name)}</td>
          <td>${esc(r.ip)}</td>
          <td>${esc(r.brand)}</td>
          <td>${esc(r.platform)}</td>
          <td>${esc(r.language)}</td>
          <td>${esc(r.screen)}</td>
          <td>${esc(r.timezone)}</td>
          <td>${esc(loc)}</td>
          <td>${esc((r.submittedAt||'').replace('T',' ').slice(0,19))}</td>
          <td><button class="del" data-id="${esc(r.id)}">Sil</button></td>
        </tr>`;
      }).join('')}
    `;
    tbl.querySelectorAll('.del').forEach(b=>{
      b.onclick = async ()=>{
        await fetch('/api/submissions/' + b.dataset.id, { method: 'DELETE' });
        load();
      };
    });
  }catch(e){
    status.textContent = 'Hata: veriler alınamadı.';
  }
}
load();
</script>
</body>
</html>
