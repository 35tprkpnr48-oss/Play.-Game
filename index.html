<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kayıt Formu</title>
<style>
  :root{--bg:#f5f5f7;--surface:#fff;--text:#1d1d1f;--muted:#6e6e73;--accent:#0071e3;--border:#d2d2d7;}
  @media (prefers-color-scheme: dark){
    :root{--bg:#121214;--surface:#1c1c1e;--text:#f2f2f7;--muted:#9a9aa0;--accent:#4da3ff;--border:#3a3a3c;}
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;min-height:100vh;}
  .wrap{width:100%;max-width:480px;padding:32px 20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;}
  h1{font-size:1.3rem;margin:0 0 4px;}
  p.sub{color:var(--muted);font-size:.92rem;margin:0 0 20px;}
  label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px;}
  input[type=text]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:1rem;margin-bottom:18px;}
  .consent{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:18px;font-size:.85rem;color:var(--muted);background:var(--bg);}
  .consent b{color:var(--text);}
  ul{margin:8px 0 0;padding-left:18px;}
  .btns{display:flex;gap:10px;flex-wrap:wrap;}
  button{flex:1;min-width:140px;padding:13px 16px;border-radius:10px;border:none;font-size:.95rem;font-weight:600;cursor:pointer;}
  .accept{background:var(--accent);color:#fff;}
  .decline{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .note{font-size:.8rem;color:var(--muted);margin-top:14px;text-align:center;}
  .done{text-align:center;padding:20px 0;}
  .done .big{font-size:2rem;}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app">Yükleniyor…</div></div>
<script>
function deviceInfo(){
  const ua = navigator.userAgent || '';
  let brand = 'Bilinmiyor';
  if(/iphone/i.test(ua)) brand = 'Apple (iPhone)';
  else if(/ipad/i.test(ua)) brand = 'Apple (iPad)';
  else if(/macintosh/i.test(ua)) brand = 'Apple (Mac)';
  else if(/android/i.test(ua)) brand = 'Android cihaz';
  else if(/windows/i.test(ua)) brand = 'Windows PC';
  else if(/linux/i.test(ua)) brand = 'Linux';
  return { userAgent: ua, brand, platform: navigator.platform || '', language: navigator.language || '',
    screen: screen.width + 'x' + screen.height, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || '' };
}

function renderForm(){
  document.getElementById('app').innerHTML = `
    <h1>Kayıt</h1>
    <p class="sub">(:</p>
    <label for="nameInput">İsminiz</label>
    <input type="text" id="nameInput" placeholder="Adınızı yazın">
    <div class="consent">
      <b>"(:</b>
      <ul>
        <li>(:</li>
        <li>:)</li>
        <li>(:</li>
        <li>:)</li>
        <li>(:</li>
      </ul>
    </div>
    <div class="btns">
      <button class="decline" id="declineBtn">İzin Verme</button>
      <button class="accept" id="acceptBtn">Devam Et ve Kabul Et</button>
    </div>
    <div class="note">(:</div>
  `;
  document.getElementById('declineBtn').onclick = ()=>{
    document.getElementById('app').innerHTML = `<div class="done"><div class="big">🙅</div><p>Tamam, hiçbir şey kaydedilmedi.</p></div>`;
  };
  document.getElementById('acceptBtn').onclick = submit;
}

async function submit(){
  const nameInput = document.getElementById('nameInput');
  const name = (nameInput.value || '').trim();
  if(!name){ nameInput.style.borderColor = '#c62828'; nameInput.focus(); return; }

  const btn = document.getElementById('acceptBtn');
  btn.disabled = true; btn.textContent = 'Konum izni bekleniyor…';

  const info = deviceInfo();
  let loc = { lat: null, lon: null, locationStatus: 'istenmedi' };
  if('geolocation' in navigator){
    try{
      const pos = await new Promise((res, rej)=> navigator.geolocation.getCurrentPosition(res, rej, { timeout: 8000 }));
      loc = { lat: pos.coords.latitude, lon: pos.coords.longitude, locationStatus: 'alındı' };
    }catch(e){ loc = { lat: null, lon: null, locationStatus: 'reddedildi/alınamadı' }; }
  }

  btn.textContent = 'Kaydediliyor…';
  try{
    await fetch('/api/submit', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name, consent: true, ...info, ...loc })
    });
    document.getElementById('app').innerHTML = `<div class="done"><div class="big">✅</div><p>Teşekkürler, ${name.replace(/[<>&]/g,'')}!</p></div>`;
  }catch(e){
    btn.disabled = false; btn.textContent = 'Devam Et';
    alert('Bir hata oluştu, tekrar deneyin.');
  }
}

renderForm();
</script>
</body>
</html>
